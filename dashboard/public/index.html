<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The King Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app" class="appShell">
    <aside class="sidebar">
      <div class="sidebarTop">
        <div class="brandBlock">
          <div class="brandIcon">TK</div>
          <div class="brandCopy">
            <h1 class="brandTitle">The King</h1>
            <p class="brandSubtitle">Control Center</p>
          </div>
        </div>

        <div class="guildSwitcherWrap">
          <label class="sidebarLabel">Server</label>
          <div id="guildSwitcherMount"></div>
        </div>

        <nav class="sidebarNav">
          <div class="sidebarGroup">
            <div class="sidebarLabel">Main</div>
            <button class="navItem" data-route="/" onclick="Dashboard.goHome()">
              <span class="navDot"></span>
              <span>Dashboard</span>
            </button>
          </div>

          <div id="guildNavGroup" class="sidebarGroup" style="display:none;">
            <div class="sidebarLabel">Workspace</div>

            <button class="navItem" data-page="overview" onclick="Dashboard.goGuildPage('overview')">
              <span class="navDot"></span>
              <span>Overview</span>
            </button>

            <button class="navItem" data-page="moderation" onclick="Dashboard.goGuildPage('moderation')">
              <span class="navDot"></span>
              <span>Moderation</span>
            </button>

            <button class="navItem" data-page="jail" onclick="Dashboard.goGuildPage('jail')">
              <span class="navDot"></span>
              <span>Jail</span>
            </button>

            <button class="navItem" data-page="role-permissions" onclick="Dashboard.goGuildPage('role-permissions')">
              <span class="navDot"></span>
              <span>Role Permissions</span>
            </button>

            <button class="navItem" data-page="commands" onclick="Dashboard.goGuildPage('commands')">
              <span class="navDot"></span>
              <span>Commands</span>
            </button>

            <button class="navItem" data-page="analytics" onclick="Dashboard.goGuildPage('analytics')">
              <span class="navDot"></span>
              <span>Analytics</span>
            </button>

            <button class="navItem" data-page="settings" onclick="Dashboard.goGuildPage('settings')">
              <span class="navDot"></span>
              <span>Settings</span>
            </button>
          </div>
        </nav>
      </div>

      <div class="sidebarBottom">
        <div id="userBadge" class="userCard" style="display:none;">
          <div class="userAvatar" id="userAvatarInitial">U</div>
          <div class="userMeta">
            <div id="userName" class="userName">User</div>
            <div class="userSub">Authenticated</div>
          </div>
          <button class="ghostButton smallButton" onclick="Dashboard.logout()">Logout</button>
        </div>

        <button id="loginButton" class="primaryButton fullWidth" onclick="Dashboard.loginWithDiscord()">
          Login with Discord
        </button>
      </div>
    </aside>

    <main class="mainShell">
      <header class="topbar">
        <div>
          <div id="breadcrumb" class="breadcrumb">Dashboard</div>
          <h2 id="pageTitle" class="pageTitle">Welcome</h2>
          <p id="pageSubtitle" class="pageSubtitle">Manage your bot, moderation, and server systems.</p>
        </div>

        <div class="topbarActions">
          <button id="backButton" class="ghostButton" style="display:none;" onclick="Dashboard.goHome()">
            ← Back
          </button>
          <button id="saveButton" class="primaryButton" style="display:none;" onclick="Dashboard.saveCurrentPage()">
            Save Changes
          </button>
        </div>
      </header>

      <div id="authNotice" class="authNotice" style="display:none;">
        <h3>Login required</h3>
        <p>Use Discord login to access only the servers where you have administrator permission.</p>
        <button class="primaryButton" onclick="Dashboard.loginWithDiscord()">Continue with Discord</button>
      </div>

      <section id="viewRoot" class="viewRoot"></section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
